name: Motorsport Job Watcher

on:
  schedule:
    # Quiet check every 5 minutes. Scheduled runs notify only when new matches exist.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: motorsport-job-watcher
  cancel-in-progress: false

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate configuration
        run: python job_watcher.py --config config.json --validate

      - name: Check career sites once
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--config config.json --once)

          # Send the full current-jobs summary on:
          #   1) first deployment / missing state,
          #   2) a manual Run workflow, or
          #   3) a GitHub Re-run (run_attempt > 1).
          # Ordinary scheduled checks stay silent unless new jobs are found.
          if [[ ! -f job_alerts.sqlite3 || "$EVENT_NAME" == "workflow_dispatch" || "$RUN_ATTEMPT" -gt 1 ]]; then
            args+=(--summary-current)
          fi

          python job_watcher.py "${args[@]}"

      - name: Persist seen-job state
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .state

          heartbeat=".state/heartbeat.txt"
          refresh_heartbeat=false
          if [[ ! -f "$heartbeat" ]]; then
            refresh_heartbeat=true
          elif find "$heartbeat" -mtime +29 -print -quit | grep -q .; then
            refresh_heartbeat=true
          fi
          if [[ "$refresh_heartbeat" == "true" ]]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > "$heartbeat"
          fi

          git add -f job_alerts.sqlite3 "$heartbeat" current_matches.md
          if git diff --cached --quiet; then
            echo "No new state to save."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update job watcher state [skip ci]"
          git pull --rebase --autostash
          git push
