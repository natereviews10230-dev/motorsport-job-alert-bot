name: Motorsport Job Watcher

"on":
  schedule:
    # Public repositories: every 5 minutes, offset from the top of the hour.
    - cron: "2/5 * * * *"
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: "Send an ntfy test notification before checking jobs"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: motorsport-job-watcher
  cancel-in-progress: false

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate configuration
        run: python job_watcher.py --config config.json --validate

      - name: Send manual-run test notification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_notification }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
        run: |
          python - <<'PY'
          import os
          import requests

          topic = os.environ.get("NTFY_TOPIC", "").strip()
          if not topic:
              raise SystemExit("Repository secret NTFY_TOPIC is missing")

          server = os.environ.get("NTFY_SERVER", "").strip() or "https://ntfy.sh"
          token = os.environ.get("NTFY_TOKEN", "").strip()
          headers = {
              "Title": "Motorsport Job Bot is online",
              "Tags": "white_check_mark,racing_car",
              "Priority": "high",
          }
          if token:
              headers["Authorization"] = f"Bearer {token}"

          response = requests.post(
              f"{server.rstrip('/')}/{topic}",
              data="GitHub Actions is now checking your target employers. Existing jobs are treated as the first-run baseline.",
              headers=headers,
              timeout=30,
          )
          response.raise_for_status()
          print("ntfy test delivered successfully")
          PY

      - name: Check career sites once
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
        run: python job_watcher.py --config config.json --once

      - name: Persist seen-job state
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .state

          # Public scheduled workflows can be disabled after long repository inactivity.
          # A small monthly heartbeat commit keeps this repository active without
          # producing a commit every five minutes.
          heartbeat=".state/heartbeat.txt"
          refresh_heartbeat=false
          if [[ ! -f "$heartbeat" ]]; then
            refresh_heartbeat=true
          elif find "$heartbeat" -mtime +29 -print -quit | grep -q .; then
            refresh_heartbeat=true
          fi
          if [[ "$refresh_heartbeat" == "true" ]]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > "$heartbeat"
          fi

          git add -f job_alerts.sqlite3 "$heartbeat"
          if git diff --cached --quiet; then
            echo "No new state to save."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update job watcher state [skip ci]"
          git pull --rebase --autostash
          git push
